<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyKanji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe2e2"/>
      <stop offset="100%" stop-color="#fdf1f1"/>
    </linearGradient>
    <linearGradient id="mountainKanji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fb3d6"/>
      <stop offset="100%" stop-color="#7e93b8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" fill="url(#skyKanji)"/>

  <!-- distant mountain -->
  <polygon points="380,220 460,90 540,220" fill="url(#mountainKanji)" opacity="0.85"/>
  <polygon points="435,140 460,90 485,140 475,155 445,155" fill="#ffffff" opacity="0.9"/>

  <!-- sakura branch (kanan atas, menjuntai) -->
  <g>
    <path d="M600 20 C 560 40, 540 60, 500 75" stroke="#8a5a45" stroke-width="4" fill="none"/>
    <circle cx="580" cy="30" r="9" fill="#f6b6c6"/>
    <circle cx="555" cy="46" r="10" fill="#f8c8d4"/>
    <circle cx="528" cy="60" r="8" fill="#f6b6c6"/>
    <circle cx="502" cy="72" r="9" fill="#f8c8d4"/>
  </g>

  <!-- sakura branch (kiri bawah) -->
  <g>
    <path d="M0 260 C 45 245, 75 225, 115 205" stroke="#8a5a45" stroke-width="4" fill="none"/>
    <circle cx="30" cy="252" r="8" fill="#f6b6c6"/>
    <circle cx="58" cy="238" r="9" fill="#f8c8d4"/>
    <circle cx="86" cy="222" r="7" fill="#f6b6c6"/>
    <circle cx="110" cy="208" r="8" fill="#f8c8d4"/>
  </g>

  <!-- floating petals -->
  <circle cx="200" cy="60" r="4" fill="#f6b6c6" opacity="0.7"/>
  <circle cx="460" cy="200" r="4" fill="#f6b6c6" opacity="0.6"/>
  <circle cx="350" cy="40" r="3" fill="#f8c8d4" opacity="0.7"/>
  <circle cx="150" cy="150" r="3" fill="#f6b6c6" opacity="0.5"/>

  <!-- ground wash -->
  <rect x="0" y="230" width="600" height="70" fill="#f6e6e4" opacity="0.6"/>
</svg>
