<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Logo Shiba Inu - DeX Gaku</title>
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#F1FBF2"/>
      <stop offset="100%" stop-color="#CFEFD3"/>
    </radialGradient>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2A65A"/>
      <stop offset="100%" stop-color="#E58F3E"/>
    </linearGradient>
  </defs>

  <!-- Cincin luar -->
  <circle cx="256" cy="256" r="250" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <g clip-path="url(#circleClip)">
    <!-- Hiasan latar: matahari Jepang samar -->
    <circle cx="256" cy="230" r="170" fill="#FFFFFF" opacity="0.55"/>

    <!-- Badan / bahu -->
    <path d="M110 520 C110 430 180 395 256 395 C332 395 402 430 402 520 Z" fill="url(#furGrad)"/>
    <!-- Bulu dada krem -->
    <path d="M200 520 C205 450 230 415 256 410 C282 415 307 450 312 520 Z" fill="#FFF3DF"/>

    <!-- Syal hijau (warna aplikasi) -->
    <path d="M168 398 C210 425 302 425 344 398 L352 432 C300 462 212 462 160 432 Z" fill="#4CAF50"/>
    <path d="M168 398 C210 425 302 425 344 398 L346 410 C300 438 212 438 166 410 Z" fill="#66C46A"/>

    <!-- Telinga kiri -->
    <path d="M118 210 L128 92 C128 78 142 72 154 80 L240 138 Z" fill="#E58F3E"/>
    <path d="M140 190 L146 112 L208 154 Z" fill="#F7C9C0"/>
    <!-- Telinga kanan -->
    <path d="M394 210 L384 92 C384 78 370 72 358 80 L272 138 Z" fill="#E58F3E"/>
    <path d="M372 190 L366 112 L304 154 Z" fill="#F7C9C0"/>

    <!-- Kepala -->
    <ellipse cx="256" cy="268" rx="150" ry="132" fill="url(#furGrad)"/>

    <!-- Pipi krem (khas shiba) -->
    <path d="M110 300 C110 250 160 240 200 268 C230 288 240 330 256 340 C272 330 282 288 312 268 C352 240 402 250 402 300 C402 360 330 400 256 400 C182 400 110 360 110 300 Z" fill="#FFF3DF"/>

    <!-- Alis krem -->
    <ellipse cx="194" cy="222" rx="20" ry="13" fill="#FFF3DF"/>
    <ellipse cx="318" cy="222" rx="20" ry="13" fill="#FFF3DF"/>

    <!-- Mata -->
    <ellipse cx="194" cy="262" rx="18" ry="22" fill="#2B1B12"/>
    <ellipse cx="318" cy="262" rx="18" ry="22" fill="#2B1B12"/>
    <circle cx="200" cy="254" r="7" fill="#FFFFFF"/>
    <circle cx="324" cy="254" r="7" fill="#FFFFFF"/>
    <circle cx="188" cy="270" r="3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="312" cy="270" r="3" fill="#FFFFFF" opacity="0.8"/>

    <!-- Pipi merona -->
    <ellipse cx="150" cy="310" rx="22" ry="13" fill="#F4A6A0" opacity="0.6"/>
    <ellipse cx="362" cy="310" rx="22" ry="13" fill="#F4A6A0" opacity="0.6"/>

    <!-- Hidung -->
    <path d="M232 318 C232 306 244 300 256 300 C268 300 280 306 280 318 C280 332 268 340 256 344 C244 340 232 332 232 318 Z" fill="#2B1B12"/>
    <ellipse cx="248" cy="313" rx="8" ry="4" fill="#FFFFFF" opacity="0.5"/>

    <!-- Mulut tersenyum -->
    <path d="M256 344 L256 358" stroke="#2B1B12" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M222 362 C234 380 252 378 256 358 C260 378 278 380 290 362" stroke="#2B1B12" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Lidah kecil -->
    <path d="M244 372 C246 390 266 390 268 372 C262 378 250 378 244 372 Z" fill="#F08A8A"/>
  </g>

  <!-- Garis tepi tipis -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#FFFFFF" stroke-width="6"/>
</svg>
