<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="qkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbeaec"/>
      <stop offset="100%" stop-color="#fdf5f4"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#qkSky)" opacity="0"/>

  <!-- distant mountain, top-right -->
  <polygon points="330,180 400,70 470,180" fill="#a9bede" opacity="0.55"/>
  <polygon points="380,110 400,70 420,110 410,120 390,120" fill="#ffffff" opacity="0.7"/>

  <!-- torii silhouette, bottom-right -->
  <g fill="#e39089" opacity="0.5">
    <rect x="330" y="200" width="10" height="55"/>
    <rect x="400" y="200" width="10" height="55"/>
    <rect x="320" y="188" width="100" height="10"/>
    <rect x="327" y="206" width="86" height="7"/>
  </g>

  <!-- sakura branch, top-left -->
  <g opacity="0.6">
    <path d="M0 40 C 30 55, 55 65, 90 75" stroke="#8a5a45" stroke-width="3" fill="none"/>
    <circle cx="20" cy="45" r="6" fill="#f6b6c6"/>
    <circle cx="42" cy="55" r="7" fill="#f8c8d4"/>
    <circle cx="65" cy="65" r="5" fill="#f6b6c6"/>
    <circle cx="85" cy="73" r="6" fill="#f8c8d4"/>
  </g>

  <!-- floating petals -->
  <circle cx="150" cy="30" r="3" fill="#f6b6c6" opacity="0.5"/>
  <circle cx="250" cy="200" r="3" fill="#f6b6c6" opacity="0.4"/>
  <circle cx="60" cy="150" r="2.5" fill="#f8c8d4" opacity="0.5"/>
</svg>
