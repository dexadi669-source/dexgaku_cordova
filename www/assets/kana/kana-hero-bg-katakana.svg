<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Latar header Katakana - origami geometris, garis tegas, huruf kana</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF4FE"/><stop offset="55%" stop-color="#D7E9FB"/><stop offset="100%" stop-color="#DCE3F7"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0"/><stop offset="100%" stop-color="#EFF6FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fieldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE6F8" stop-opacity="1"/><stop offset="65%" stop-color="#DCE6F8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#A9C3E8" stroke-width="1.6" opacity=".5"/>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1A3550" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1080" height="620" fill="url(#bg)"/>

  <!-- Aksen lingkaran geometris di belakang judul (bukan matahari bundar seperti Hiragana) -->
  <rect x="605" y="35" width="350" height="350" rx="36" fill="#5AA0E0" opacity=".14" transform="rotate(12 780 210)"/>
  <rect x="640" y="70" width="280" height="280" rx="28" fill="#FFFFFF" opacity=".4" transform="rotate(12 780 210)"/>

  <!-- Pegunungan lembut bernuansa biru -->
  <path d="M-10 380 L120 322 L210 352 L340 276 L470 342 L560 302 L700 356 L820 306 L960 348 L1090 318 L1090 460 L-10 460Z" fill="#B9CDEE" opacity=".45"/>
  <rect x="0" y="310" width="1080" height="150" fill="url(#mist)"/>

  <!-- Huruf katakana besar samar -->
  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-weight="800" fill="#1A3550" opacity=".07">
    <text x="470" y="150" font-size="130" transform="rotate(-8 470 150)">&#12450;</text>
    <text x="610" y="140" font-size="120" transform="rotate(9 610 140)">&#12459;</text>
  </g>

  <!-- Grid garis tegas di strip bawah (bukan pola sisik asanoha seperti Hiragana) -->
  <rect x="0" y="500" width="1080" height="120" fill="url(#grid)"/>
  <rect x="0" y="500" width="1080" height="120" fill="url(#fieldFade)"/>

  <!-- Origami burung bangau kanan bawah (pengganti kipas kertas Hiragana) -->
  <g transform="translate(940 440) rotate(8) scale(0.66)">
    <polygon points="0,-120 70,10 0,60 -70,10" fill="#6FB3E8"/>
    <polygon points="0,-120 70,10 0,10" fill="#A9D3F2" opacity=".8"/>
    <polygon points="-70,10 0,10 0,60" fill="#A9D3F2" opacity=".55"/>
    <polygon points="70,10 130,-30 90,20" fill="#6FB3E8"/>
    <polygon points="-70,10 -130,-30 -90,20" fill="#6FB3E8"/>
    <line x1="0" y1="-120" x2="0" y2="60" stroke="#1A3550" stroke-width="2" opacity=".18"/>
  </g>

  <!-- Kartu digital biru, di strip bawah dekat origami (pengganti lentera merah Hiragana) -->
  <g transform="translate(1000 585) scale(0.42)">
    <rect x="-80" y="-96" width="160" height="108" rx="18" fill="#2E7FB8"/>
    <rect x="-80" y="-96" width="160" height="108" rx="18" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".35"/>
    <circle cx="-52" cy="-70" r="7" fill="#FFFFFF" opacity=".5"/>
    <circle cx="-30" cy="-70" r="7" fill="#FFFFFF" opacity=".3"/>
    <text x="0" y="-24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">&#23398;</text>
    <rect x="-80" y="12" width="160" height="10" rx="5" fill="#2E7FB8"/>
  </g>

  <!-- Ubin huruf katakana: dikelompokkan di kanan-atas -->
  <g filter="url(#soft)" transform="translate(760 78) rotate(-9) scale(0.62)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FBFDFF" stroke="#B9D7F2" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#3F86D6"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#3F86D6"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="58" font-weight="800" fill="#1A3550">&#12450;</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#3F86D6">a</text>
  </g>
  <g filter="url(#soft)" transform="translate(910 100) rotate(8) scale(0.58)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FBFDFF" stroke="#F6D0DE" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#D65C8A"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#D65C8A"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="58" font-weight="800" fill="#1A3550">&#12459;</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#D65C8A">ka</text>
  </g>
  <g filter="url(#soft)" transform="translate(840 210) rotate(-6) scale(0.5)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FBFDFF" stroke="#C9E8C0" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#4FA35A"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#4FA35A"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="58" font-weight="800" fill="#1A3550">&#12469;</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#4FA35A">sa</text>
  </g>
  <g filter="url(#soft)" transform="translate(1000 220) rotate(7) scale(0.46)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FBFDFF" stroke="#F6E0A6" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#D69A2E"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#D69A2E"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="58" font-weight="800" fill="#1A3550">&#12479;</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#D69A2E">ta</text>
  </g>

  <path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#7FD8E8" transform="translate(700 40) scale(0.7)"/><path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#7FD8E8" transform="translate(1010 60) scale(0.6)"/><path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#7FD8E8" transform="translate(760 470) scale(0.6)"/><path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#7FD8E8" transform="translate(300 560) scale(0.6)"/>
  <rect x="-1" y="-1" width="22" height="22" fill="#7FBFE8" opacity="0.8" transform="translate(650 34) rotate(45)"/><rect x="-1" y="-1" width="17.6" height="17.6" fill="#F2A9C4" opacity="0.7" transform="translate(960 44) rotate(45)"/><rect x="-1" y="-1" width="24.200000000000003" height="24.200000000000003" fill="#7FD8B0" opacity="0.7" transform="translate(1040 175) rotate(45)"/>
  <rect x="-1" y="-1" width="22" height="22" fill="#7FBFE8" opacity="0.6" transform="translate(700 560) rotate(45)"/><rect x="-1" y="-1" width="17.6" height="17.6" fill="#F2A9C4" opacity="0.6" transform="translate(1000 500) rotate(45)"/><rect x="-1" y="-1" width="19.8" height="19.8" fill="#7FD8B0" opacity="0.7" transform="translate(220 40) rotate(45)"/>
</svg>
