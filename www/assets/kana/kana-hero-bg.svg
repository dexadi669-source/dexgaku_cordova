  <g filter="url(#soft)" transform="translate(760 78) rotate(-9) scale(0.62)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FFFDFB" stroke="#F6C0A6" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#E8735A"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#E8735A"/>
