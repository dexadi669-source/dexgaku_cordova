    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#E8735A">a</text>
  </g>
  <g filter="url(#soft)" transform="translate(910 100) rotate(8) scale(0.58)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FFFDFB" stroke="#A6D3E0" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#3F9FB6"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#3F9FB6"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="58" font-weight="800" fill="#7A2020">&#12363;</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#3F9FB6">ka</text>
  </g>
  <g filter="url(#soft)" transform="translate(840 210) rotate(-6) scale(0.5)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FFFDFB" stroke="#F4A6C4" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#E0507E"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#E0507E"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="58" font-weight="800" fill="#7A2020">&#12373;</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#E0507E">sa</text>
  </g>
