<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Latar header Hiragana/Katakana - kipas kertas, lentera, huruf kana</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF1F0"/><stop offset="55%" stop-color="#FCDCDA"/><stop offset="100%" stop-color="#F9D6E3"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0EE" stop-opacity="0"/><stop offset="100%" stop-color="#FFF0EE" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fieldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8DCE0" stop-opacity="1"/><stop offset="65%" stop-color="#F8DCE0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="asanoha" width="52" height="90" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E7A0A8" stroke-width="2" opacity=".55">
        <path d="M26 0 L52 15 L52 45 L26 60 L0 45 L0 15 Z"/>
        <path d="M26 0 L26 60 M0 15 L52 45 M52 15 L0 45"/>
      </g>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7A2020" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1080" height="620" fill="url(#bg)"/>

  <!-- Matahari lembut di belakang judul (di sisi kanan, area kosong) -->
  <circle cx="780" cy="210" r="175" fill="#FFA98F" opacity=".14"/>
  <circle cx="780" cy="210" r="118" fill="#FFFFFF" opacity=".38"/>

  <!-- Pegunungan lembut -->
  <path d="M-10 380 L120 322 L210 352 L340 276 L470 342 L560 302 L700 356 L820 306 L960 348 L1090 318 L1090 460 L-10 460Z" fill="#F3B9BC" opacity=".4"/>
  <rect x="0" y="310" width="1080" height="150" fill="url(#mist)"/>

  <!-- Huruf kana besar samar -->
  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-weight="800" fill="#7A2020" opacity=".06">
    <text x="470" y="150" font-size="130" transform="rotate(-8 470 150)">&#12354;</text>
    <text x="610" y="140" font-size="120" transform="rotate(9 610 140)">&#12450;</text>
  </g>

  <!-- Hamparan pola asanoha di strip bawah -->
  <rect x="0" y="500" width="1080" height="120" fill="url(#asanoha)"/>
  <rect x="0" y="500" width="1080" height="120" fill="url(#fieldFade)"/>

  <!-- Kipas kertas kanan bawah, di luar area teks -->
  <g transform="translate(940 430) rotate(-18) scale(0.62)">
    <path d="M-160 0 A160 160 0 0 1 160 0 L0 0 Z" fill="#F4B5C0"/>
    <path d="M-160 0 A160 160 0 0 1 -60 -148 L0 0 Z" fill="#F8D3DA" opacity=".85"/>
    <line x1="0" y1="0" x2="150.35081932574536" y2="-54.72322293210699" stroke="#B5895A" stroke-width="3"/><line x1="0" y1="0" x2="122.56711089903648" y2="-102.84601754984628" stroke="#B5895A" stroke-width="3"/><line x1="0" y1="0" x2="80.00000000000001" y2="-138.56406460551017" stroke="#B5895A" stroke-width="3"/><line x1="0" y1="0" x2="27.783708426708866" y2="-157.56924048195327" stroke="#B5895A" stroke-width="3"/><line x1="0" y1="0" x2="-27.78370842670885" y2="-157.56924048195327" stroke="#B5895A" stroke-width="3"/><line x1="0" y1="0" x2="-79.99999999999997" y2="-138.5640646055102" stroke="#B5895A" stroke-width="3"/><line x1="0" y1="0" x2="-122.56711089903646" y2="-102.84601754984632" stroke="#B5895A" stroke-width="3"/><line x1="0" y1="0" x2="-150.35081932574533" y2="-54.72322293210702" stroke="#B5895A" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#B5895A"/>
  </g>

  <!-- Lentera merah, pojok kiri bawah -->
  <g transform="translate(80 430) scale(0.72)">
    <line x1="0" y1="-140" x2="0" y2="-96" stroke="#8A5A3A" stroke-width="4"/>
    <ellipse cx="0" cy="-40" rx="58" ry="72" fill="#E85B4F"/>
    <ellipse cx="0" cy="-40" rx="58" ry="72" fill="none" stroke="#B5352A" stroke-width="3"/>
    <line x1="-58" y1="-40" x2="58" y2="-40" stroke="#B5352A" stroke-width="2.5"/>
    <line x1="-46" y1="-78" x2="46" y2="-78" stroke="#B5352A" stroke-width="2"/>
    <line x1="-46" y1="4" x2="46" y2="4" stroke="#B5352A" stroke-width="2"/>
    <rect x="-14" y="-118" width="28" height="14" rx="4" fill="#8A5A3A"/>
    <rect x="-10" y="26" width="20" height="12" rx="3" fill="#8A5A3A"/>
    <line x1="0" y1="38" x2="0" y2="70" stroke="#8A5A3A" stroke-width="3"/>
    <text x="0" y="-30" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="34" font-weight="800" fill="#FFF3E8">&#23398;</text>
  </g>

