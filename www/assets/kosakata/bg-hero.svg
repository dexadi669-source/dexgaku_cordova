<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Latar header Kosakata - Fuji, sakura, Shiba, flashcard</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9EE"/>
      <stop offset="55%" stop-color="#FDD9E4"/>
      <stop offset="100%" stop-color="#F8CFE0"/>
    </linearGradient>
    <linearGradient id="fujiBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C8CC8"/>
      <stop offset="100%" stop-color="#C9B7E2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFF0F5" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C9DC"/>
      <stop offset="100%" stop-color="#EBB4CD"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4AB5E"/>
      <stop offset="100%" stop-color="#E58F3E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F1FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5A3A5A" flood-opacity="0.22"/>
    </filter>
    <g id="blossom">
      <g fill="#F9B9CF">
        <ellipse cx="0" cy="-11" rx="7" ry="10"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(288)"/>
      </g>
      <circle r="4" fill="#E9769F"/>
    </g>
    <path id="petal" d="M0 0 q8-11 18 0 q-6 11 -18 0z" fill="#F8A9C4"/>
  </defs>

  <!-- Langit -->
  <rect width="1080" height="720" fill="url(#sky)"/>
  <circle cx="330" cy="330" r="120" fill="#FFF6E8" opacity="0.7"/>
  <circle cx="330" cy="330" r="82" fill="#FFFFFF" opacity="0.55"/>
  <g fill="#FFFFFF" opacity="0.6">
    <ellipse cx="170" cy="250" rx="90" ry="20"/><ellipse cx="230" cy="236" rx="58" ry="18"/>
    <ellipse cx="820" cy="270" rx="100" ry="20"/><ellipse cx="890" cy="256" rx="62" ry="17"/>
  </g>

  <!-- Gunung Fuji (puncak terlihat di antara subjudul dan kartu) -->
  <path d="M-160 560 L540 210 Q560 198 580 210 L1240 560 Z" fill="url(#fujiBody)"/>
  <path d="M452 262 L540 212 Q560 200 580 212 L662 268 L632 256 L612 278 L582 254 L556 282 L530 256 L500 280 L480 258 Z" fill="#FFFFFF" opacity="0.92"/>
  <path d="M580 210 L1240 560 L700 560 Z" fill="#8371B5" opacity="0.28"/>
  <rect x="0" y="450" width="1080" height="110" fill="url(#mist)"/>

  <!-- Danau -->
  <rect x="0" y="560" width="1080" height="160" fill="url(#lake)"/>
  <path d="M-160 566 L540 700 Q560 710 580 700 L1240 566 Z" fill="#B79BD3" opacity="0.26"/>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M40 620 h130"/><path d="M110 650 h90"/><path d="M700 640 h130"/><path d="M780 672 h100"/><path d="M400 690 h110"/>
  </g>

  <!-- Cabang sakura kiri-atas -->
  <path d="M-10 40 C70 46 130 84 190 150" stroke="#7B4B3A" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M84 66 C108 40 138 26 172 22" stroke="#7B4B3A" stroke-width="6" stroke-linecap="round" fill="none"/>
  <use href="#blossom" x="66" y="62"/><use href="#blossom" x="120" y="76" transform="translate(120 76) scale(1.1) translate(-120 -76)"/>
  <use href="#blossom" x="172" y="26"/><use href="#blossom" x="196" y="156" transform="translate(196 156) scale(0.9) translate(-196 -156)"/>
  <use href="#blossom" x="30" y="46" transform="translate(30 46) scale(0.8) translate(-30 -46)"/>

  <!-- Cabang sakura kiri-bawah -->
  <path d="M-10 690 C60 676 116 640 150 596" stroke="#7B4B3A" stroke-width="11" stroke-linecap="round" fill="none"/>
  <use href="#blossom" x="54" y="668"/><use href="#blossom" x="112" y="630" transform="translate(112 630) scale(1.1) translate(-112 -630)"/>
  <use href="#blossom" x="152" y="598" transform="translate(152 598) scale(0.9) translate(-152 -598)"/>

  <!-- Cabang sakura kanan-bawah -->
  <path d="M1090 700 C1010 692 960 664 930 628" stroke="#7B4B3A" stroke-width="11" stroke-linecap="round" fill="none"/>
  <use href="#blossom" x="1040" y="680" transform="translate(1040 680) scale(1.05) translate(-1040 -680)"/>
  <use href="#blossom" x="978" y="668"/><use href="#blossom" x="934" y="632" transform="translate(934 632) scale(0.85) translate(-934 -632)"/>

  <!-- Kelopak -->
  <use href="#petal" x="330" y="60"  transform="rotate(20 330 60)"/>
  <use href="#petal" x="700" y="46"  transform="rotate(-25 700 46)"/>
  <use href="#petal" x="470" y="130" transform="rotate(35 470 130)"/>
  <use href="#petal" x="40"  y="300" transform="rotate(-15 40 300)"/>
  <use href="#petal" x="1030" y="330" transform="rotate(30 1030 330)"/>
  <use href="#petal" x="560" y="620" transform="rotate(-40 560 620)"/>
  <use href="#petal" x="250" y="600" transform="rotate(10 250 600)"/>

  <!-- Bintang -->
  <g fill="#FFD86B">
    <path d="M560 60 l5 11 l12 1 l-9 8 l3 12 l-11 -6 l-11 6 l3 -12 l-9 -8 l12 -1z"/>
    <path d="M1020 190 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z"/>
    <path d="M330 640 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z"/>
  </g>

  <g filter="url(#soft)" transform="translate(930 96) rotate(10) scale(0.9)">
    <rect x="-70" y="-48" width="140" height="96" rx="14" fill="url(#card)" stroke="#B9A3E8" stroke-width="4"/>
    <path d="M-70 -34 C-70 -42 -64 -48 -56 -48 L56 -48 C64 -48 70 -42 70 -34 L70 -24 L-70 -24 Z" fill="#9C6FD6"/>
    <circle cx="-52" cy="-36" r="4" fill="#fff" opacity="0.85"/><circle cx="-38" cy="-36" r="4" fill="#fff" opacity="0.55"/>
    <text x="0" y="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#2B1B12">水</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#8A6BC4">みず</text>
  </g>
  <g filter="url(#soft)" transform="translate(90 190) rotate(-12) scale(0.7)">
    <rect x="-70" y="-48" width="140" height="96" rx="14" fill="url(#card)" stroke="#F4A6C4" stroke-width="4"/>
    <path d="M-70 -34 C-70 -42 -64 -48 -56 -48 L56 -48 C64 -48 70 -42 70 -34 L70 -24 L-70 -24 Z" fill="#F48FB1"/>
    <circle cx="-52" cy="-36" r="4" fill="#fff" opacity="0.85"/><circle cx="-38" cy="-36" r="4" fill="#fff" opacity="0.55"/>
    <text x="0" y="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#2B1B12">山</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#D2668E">やま</text>
  </g>
  <g filter="url(#soft)" transform="translate(380 660) rotate(-6) scale(0.62)">
    <rect x="-70" y="-48" width="140" height="96" rx="14" fill="url(#card)" stroke="#8FC7F0" stroke-width="4"/>
    <path d="M-70 -34 C-70 -42 -64 -48 -56 -48 L56 -48 C64 -48 70 -42 70 -34 L70 -24 L-70 -24 Z" fill="#5AA9E6"/>
    <circle cx="-52" cy="-36" r="4" fill="#fff" opacity="0.85"/><circle cx="-38" cy="-36" r="4" fill="#fff" opacity="0.55"/>
    <text x="0" y="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#2B1B12">花</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#4A8FCB">はな</text>
  </g>
  <g filter="url(#soft)" transform="translate(640 668) rotate(7) scale(0.58)">
    <rect x="-70" y="-48" width="140" height="96" rx="14" fill="url(#card)" stroke="#9BD3A8" stroke-width="4"/>
    <path d="M-70 -34 C-70 -42 -64 -48 -56 -48 L56 -48 C64 -48 70 -42 70 -34 L70 -24 L-70 -24 Z" fill="#66BB6A"/>
    <circle cx="-52" cy="-36" r="4" fill="#fff" opacity="0.85"/><circle cx="-38" cy="-36" r="4" fill="#fff" opacity="0.55"/>
    <text x="0" y="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#2B1B12">空</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#3E8E48">そら</text>
  </g>


  <!-- Pengisi sisi kanan (pengganti Shiba) -->
  <use href="#petal" x="880" y="250" transform="rotate(25 880 250)"/>
  <use href="#petal" x="1010" y="120" transform="rotate(-30 1010 120)"/>
  <g fill="#FFD86B">
    <path d="M800 210 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z"/>
  </g>
</svg>
