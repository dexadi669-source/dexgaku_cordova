<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0dc"/>
      <stop offset="100%" stop-color="#fff5f4"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa8c9"/>
      <stop offset="100%" stop-color="#6f89ac"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="330" cy="140" r="70" fill="#f4a3a0" opacity="0.85"/>

  <!-- mountain -->
  <polygon points="230,300 340,110 450,300" fill="url(#mountain)"/>
  <polygon points="300,160 340,110 380,160 365,180 315,180" fill="#ffffff"/>

  <!-- torii gate -->
  <g fill="#c1443a">
    <rect x="330" y="220" width="16" height="80" />
    <rect x="430" y="220" width="16" height="80" />
    <rect x="315" y="205" width="146" height="16" />
    <rect x="325" y="230" width="126" height="10" />
  </g>

  <!-- sakura branch (kiri) -->
  <g>
    <path d="M0 260 C 40 240, 70 220, 120 210" stroke="#8a5a45" stroke-width="4" fill="none"/>
    <circle cx="30" cy="250" r="8" fill="#f6b6c6"/>
    <circle cx="55" cy="235" r="9" fill="#f6b6c6"/>
    <circle cx="80" cy="225" r="7" fill="#f8c8d4"/>
    <circle cx="105" cy="215" r="8" fill="#f6b6c6"/>
  </g>

  <!-- sakura branch (kanan atas) -->
  <g>
    <path d="M600 60 C 560 80, 540 100, 500 110" stroke="#8a5a45" stroke-width="4" fill="none"/>
    <circle cx="580" cy="70" r="8" fill="#f6b6c6"/>
    <circle cx="555" cy="85" r="9" fill="#f8c8d4"/>
    <circle cx="530" cy="98" r="7" fill="#f6b6c6"/>
    <circle cx="505" cy="108" r="8" fill="#f8c8d4"/>
  </g>

  <!-- floating petals -->
  <circle cx="150" cy="90" r="4" fill="#f6b6c6" opacity="0.8"/>
  <circle cx="480" cy="180" r="4" fill="#f6b6c6" opacity="0.7"/>
  <circle cx="520" cy="260" r="3" fill="#f8c8d4" opacity="0.7"/>
  <circle cx="90" cy="160" r="3" fill="#f6b6c6" opacity="0.6"/>

  <!-- ground -->
  <rect x="0" y="300" width="600" height="100" fill="#e9d9d6"/>
</svg>
