  <path d="M440 250 L1200 570 L600 570 Z" fill="#8371B5" opacity="0.28"/>
  <!-- kabut kaki gunung -->
  <rect x="0" y="470" width="1080" height="110" fill="url(#mist)"/>

  <!-- Danau -->
  <rect x="0" y="570" width="1080" height="440" fill="url(#lake)"/>
