<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1000" width="1080" height="1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Latar header Kosakata - Fuji, sakura, Shiba, flashcard</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9EE"/>
      <stop offset="55%" stop-color="#FDD9E4"/>
      <stop offset="100%" stop-color="#F8CFE0"/>
    </linearGradient>
    <linearGradient id="fujiBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C8CC8"/>
      <stop offset="100%" stop-color="#C9B7E2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFF0F5" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C9DC"/>
      <stop offset="100%" stop-color="#EBB4CD"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4AB5E"/>
      <stop offset="100%" stop-color="#E58F3E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F1FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5A3A5A" flood-opacity="0.22"/>
    </filter>
    <g id="blossom">
      <g fill="#F9B9CF">
        <ellipse cx="0" cy="-11" rx="7" ry="10"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="7" ry="10" transform="rotate(288)"/>
      </g>
      <circle r="4" fill="#E9769F"/>
    </g>
    <path id="petal" d="M0 0 q8-11 18 0 q-6 11 -18 0z" fill="#F8A9C4"/>
  </defs>

  <!-- Langit -->
  <rect width="1080" height="1000" fill="url(#sky)"/>
  <g transform="translate(0 40)">
  <!-- Matahari lembut -->
  <circle cx="360" cy="250" r="120" fill="#FFF6E8" opacity="0.7"/>
  <circle cx="360" cy="250" r="82" fill="#FFFFFF" opacity="0.55"/>

  <!-- Awan tipis -->
  <g fill="#FFFFFF" opacity="0.6">
    <ellipse cx="180" cy="190" rx="90" ry="20"/>
    <ellipse cx="240" cy="176" rx="58" ry="18"/>
    <ellipse cx="760" cy="150" rx="100" ry="20"/>
    <ellipse cx="830" cy="136" rx="62" ry="17"/>
  </g>

  <!-- Gunung Fuji -->
  <path d="M-120 570 L400 250 Q420 236 440 250 L1200 570 Z" fill="url(#fujiBody)"/>
  <!-- puncak salju -->
  <path d="M320 310 L400 252 Q420 240 440 252 L520 314 L490 300 L470 322 L440 296 L415 326 L392 298 L360 322 L340 300 Z" fill="#FFFFFF" opacity="0.92"/>
