    <text x="0" y="22" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#2B1B12">花</text>
    <text x="0" y="40" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="13" font-weight="700" fill="#4A8FCB">はな</text>
