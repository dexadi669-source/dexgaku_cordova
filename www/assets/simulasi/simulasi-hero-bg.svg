<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Latar header Simulasi JLPT - lembar jawaban, segel kelulusan, pensil</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF0FF"/><stop offset="55%" stop-color="#D8E3FB"/><stop offset="100%" stop-color="#DCE6F5"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF3FF" stop-opacity="0"/><stop offset="100%" stop-color="#EEF3FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fieldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDE7FA" stop-opacity="1"/><stop offset="65%" stop-color="#DDE7FA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="60" height="34" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="60" y2="30" stroke="#A8BFE8" stroke-width="1.6" opacity=".55"/>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2A44" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1080" height="760" fill="url(#bg)"/>

  <!-- Aksen lingkaran di belakang judul -->
  <circle cx="540" cy="250" r="205" fill="#5A78D8" opacity=".1"/>
  <circle cx="540" cy="250" r="140" fill="#FFFFFF" opacity=".35"/>

  <!-- Pegunungan lembut -->
  <path d="M-10 480 L120 410 L210 448 L340 352 L470 434 L560 384 L700 452 L820 390 L960 442 L1090 404 L1090 560 L-10 560Z" fill="#B7C7EE" opacity=".4"/>
  <rect x="0" y="400" width="1080" height="200" fill="url(#mist)"/>

  <!-- Huruf samar -->
  <g font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-weight="800" fill="#1E2A44" opacity=".05">
    <text x="470" y="150" font-size="120" transform="rotate(-8 470 150)">&#35388;</text>
    <text x="610" y="140" font-size="110" transform="rotate(9 610 140)">N5</text>
  </g>

  <!-- Kertas bergaris di strip bawah (lembar jawaban) -->
  <rect x="0" y="500" width="1080" height="260" fill="url(#lines)"/>
  <rect x="0" y="500" width="1080" height="260" fill="url(#fieldFade)"/>

  <!-- Lembar ujian / clipboard kanan -->
  <g transform="translate(945 430) scale(0.62)">
    <rect x="-110" y="-160" width="220" height="270" rx="16" fill="#FFFFFF" stroke="#C7D4F0" stroke-width="4"/>
    <rect x="-36" y="-178" width="72" height="28" rx="8" fill="#6B85D8"/>
    <rect x="-80" y="-118" width="160" height="12" rx="6" fill="#DCE4F7"/>
    <rect x="-80" y="-90" width="120" height="12" rx="6" fill="#DCE4F7"/>
    <g>
      <circle cx="-68" cy="-52" r="9" fill="none" stroke="#8FA3DE" stroke-width="3"/>
      <path d="M-73 -52 l4 5 l8 -9" stroke="#4CAF50" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <rect x="-44" y="-58" width="96" height="12" rx="6" fill="#EDF1FB"/>
    </g>
    <g>
      <circle cx="-68" cy="-14" r="9" fill="none" stroke="#8FA3DE" stroke-width="3"/>
      <rect x="-44" y="-20" width="80" height="12" rx="6" fill="#EDF1FB"/>
    </g>
    <g>
      <circle cx="-68" cy="24" r="9" fill="none" stroke="#8FA3DE" stroke-width="3"/>
      <path d="M-73 24 l4 5 l8 -9" stroke="#4CAF50" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <rect x="-44" y="18" width="96" height="12" rx="6" fill="#EDF1FB"/>
    </g>
    <g>
      <circle cx="-68" cy="62" r="9" fill="none" stroke="#F2A65A" stroke-width="3"/>
      <path d="M-73 62 l10 10 M-63 62 l-10 10" stroke="#E6395B" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-44" y="56" width="70" height="12" rx="6" fill="#EDF1FB"/>
    </g>
  </g>

  <!-- Pensil 2B menyilang bawah -->
  <g transform="translate(870 40) rotate(18) scale(0.4)">
    <rect x="-170" y="-11" width="300" height="22" rx="6" fill="#F2C245"/>
    <rect x="-170" y="-11" width="300" height="7" fill="#FFE28A"/>
    <polygon points="130,-11 170,0 130,11" fill="#EAC27A"/>
    <rect x="150" y="-6" width="14" height="12" fill="#3A3A3A"/>
    <rect x="-190" y="-13" width="24" height="26" rx="4" fill="#E6395B"/>
    <rect x="-200" y="-9" width="14" height="18" rx="3" fill="#C9D6E8"/>
  </g>

  <!-- Ubin/kartu kanji melayang: dikelompokkan kanan-atas -->
  <g filter="url(#soft)" transform="translate(430 84) rotate(-9) scale(0.72)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FBFDFF" stroke="#F6C0A6" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#E8735A"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#E8735A"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="52" font-weight="800" fill="#1E2A44">&#35388;</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="12" font-weight="700" fill="#E8735A">kelulusan</text>
  </g>
  <g filter="url(#soft)" transform="translate(650 92) rotate(8) scale(0.68)">
    <rect x="-46" y="-52" width="92" height="104" rx="14" fill="#FBFDFF" stroke="#A6D3E0" stroke-width="5"/>
    <rect x="-46" y="-52" width="92" height="20" rx="14" fill="#3F86D6"/>
    <rect x="-46" y="-42" width="92" height="10" fill="#3F86D6"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="52" font-weight="800" fill="#1E2A44">N5</text>
    <text x="0" y="44" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="12" font-weight="700" fill="#3F86D6">level</text>
  </g>

  <!-- Bintang & centang kecil -->
  <path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#FFD86B" transform="translate(300 60) scale(0.8)"/><path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#FFD86B" transform="translate(700 40) scale(0.7)"/><path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#FFD86B" transform="translate(1000 60) scale(0.6)"/><path d="M0 -12 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#FFD86B" transform="translate(650 700) scale(0.5)"/>
  <g transform="translate(870 130) rotate(0) scale(0.55)">
    <circle cx="0" cy="0" r="26" fill="#4CAF50"/>
    <path d="M-11 0 L-3 9 L12 -10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g><g transform="translate(200 150) rotate(0) scale(0.5)">
    <circle cx="0" cy="0" r="26" fill="#5A78D8"/>
    <path d="M-11 0 L-3 9 L12 -10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
