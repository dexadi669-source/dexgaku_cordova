<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#FDFBF7" />

  <!-- Box Catatan Aturan -->
  <rect x="50" y="25" width="700" height="90" fill="#FFF" stroke="#E74C3C" stroke-width="2" rx="8"/>
  <text x="400" y="55" font-family="sans-serif" font-size="20" fill="#E74C3C" font-weight="bold" text-anchor="middle">【ゴミ出しのルール】</text>
  <text x="400" y="90" font-family="sans-serif" font-size="18" fill="#333" text-anchor="middle">燃えるゴミ: 火曜日・金曜日 ／ ペットボトル: 水曜日</text>

  <!-- Baris Hari Kalender -->
  <!-- 月 -->
  <rect x="50" y="150" width="90" height="180" fill="#FFF" stroke="#DDD" rx="6"/>
  <text x="95" y="190" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold" text-anchor="middle">月</text>

  <!-- 火 (Moeru Gomi) -->
  <rect x="150" y="150" width="90" height="180" fill="#FFF" stroke="#DDD" rx="6"/>
  <text x="195" y="190" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold" text-anchor="middle">火</text>
  <circle cx="195" cy="240" r="25" fill="#FFEBEE"/>
  <text x="195" y="246" font-family="sans-serif" font-size="12" fill="#C0392B" font-weight="bold" text-anchor="middle">燃える</text>

  <!-- 水 (Pet Botol) -->
  <rect x="250" y="150" width="90" height="180" fill="#FFF" stroke="#DDD" rx="6"/>
  <text x="295" y="190" font-family="sans-serif" font-size="20" fill="#333" font-weight="bold" text-anchor="middle">水</text>
  <circle cx="295" cy="240" r="25" fill="#E3F2FD"/>
  <text x="295" y="246" font-family="sans-serif" font-size="11" fill="#1976D2" font-weight="bold" text-anchor="middle">ペット</text>

  <!-- 木 (TODAY / 今日) -->
  <rect x="350" y="150" width="100" height="180" fill="#FFF8E1" stroke="#FFA000" stroke-width="3" rx="6"/>
  <text x="400" y="185" font-family="sans-serif" font-size="20" fill="#D35400" font-weight="bold" text-anchor="middle">木</text>
  <rect x="365" y="210" width="70" height="30" fill="#FFA000" rx="4"/>
  <text x="400" y="231" font-family="sans-serif" font-size="14" fill="#FFF" font-weight="bold" text-anchor="middle">今日</text>

  <!-- 金 (TARGET JAWABAN) -->
  <rect x="460" y="150" width="90" height="180" fill="#E8F5E9" stroke="#2ECC71" stroke-width="3" rx="6"/>
  <text x="505" y="190" font-family="sans-serif" font-size="22" fill="#27AE60" font-weight="bold" text-anchor="middle">金</text>
  <circle cx="505" cy="240" r="25" fill="#2ECC71"/>
  <text x="505" y="246" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold" text-anchor="middle">燃える</text>
  <text x="505" y="305" font-family="sans-serif" font-size="16" fill="#27AE60" font-weight="bold" text-anchor="middle">NEXT!</text>

  <!-- 土 & 日 -->
  <rect x="560" y="150" width="90" height="180" fill="#FFF" stroke="#DDD" rx="6"/>
  <text x="605" y="190" font-family="sans-serif" font-size="20" fill="#2980B9" font-weight="bold" text-anchor="middle">土</text>

  <rect x="660" y="150" width="90" height="180" fill="#FFF" stroke="#DDD" rx="6"/>
  <text x="705" y="190" font-family="sans-serif" font-size="20" fill="#C0392B" font-weight="bold" text-anchor="middle">日</text>
</svg>
