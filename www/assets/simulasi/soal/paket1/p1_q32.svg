<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Latar Belakang -->
  <rect width="800" height="450" fill="#FDFBF7" />

  <!-- Bingkai Rak Buku -->
  <rect x="150" y="40" width="500" height="370" fill="#E8D5C4" rx="10" />
  <!-- Slot Majalah -->
  <rect x="170" y="60" width="220" height="160" fill="#FFFFFF" rx="5" /> <!-- Slot 1 -->
  <rect x="410" y="60" width="220" height="160" fill="#FFFFFF" rx="5" /> <!-- Slot 2 -->
  <rect x="170" y="230" width="220" height="160" fill="#FFFFFF" rx="5" /> <!-- Slot 3 -->
  <rect x="410" y="230" width="220" height="160" fill="#FFFFFF" rx="5" /> <!-- Slot 4 -->

  <!-- Garis Pemisah Rak Tengah -->
  <line x1="150" y1="225" x2="650" y2="225" stroke="#C4A484" stroke-width="10" />

  <!-- OPSI 1: Majalah Jam, Bulan 7 (Jawaban Benar) -->
  <text x="195" y="95" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">1</text>
  <text x="280" y="100" font-family="sans-serif" font-size="28" fill="#E74C3C" font-weight="bold" text-anchor="middle">7月</text>
  <circle cx="280" cy="155" r="35" fill="none" stroke="#008080" stroke-width="5"/>
  <polyline points="280,135 280,155 295,155" fill="none" stroke="#008080" stroke-width="5"/>

  <!-- OPSI 2: Majalah Jam, Bulan 8 -->
  <text x="435" y="95" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">2</text>
  <text x="520" y="100" font-family="sans-serif" font-size="28" fill="#E74C3C" font-weight="bold" text-anchor="middle">8月</text>
  <circle cx="520" cy="155" r="35" fill="none" stroke="#008080" stroke-width="5"/>
  <polyline points="520,135 520,155 535,155" fill="none" stroke="#008080" stroke-width="5"/>

  <!-- OPSI 3: Majalah Mobil, Bulan 7 -->
  <text x="195" y="265" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">3</text>
  <text x="280" y="270" font-family="sans-serif" font-size="28" fill="#E74C3C" font-weight="bold" text-anchor="middle">7月</text>
  <!-- Ikon Mobil -->
  <path d="M 240 335 L 255 310 L 305 310 L 320 335 Z" fill="#008080" />
  <rect x="230" y="335" width="100" height="25" fill="#008080" rx="6" />
  <circle cx="255" cy="360" r="12" fill="#333"/>
  <circle cx="305" cy="360" r="12" fill="#333"/>

  <!-- OPSI 4: Majalah Mobil, Bulan 8 -->
  <text x="435" y="265" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">4</text>
  <text x="520" y="270" font-family="sans-serif" font-size="28" fill="#E74C3C" font-weight="bold" text-anchor="middle">8月</text>
  <!-- Ikon Mobil -->
  <path d="M 480 335 L 495 310 L 545 310 L 560 335 Z" fill="#008080" />
  <rect x="470" y="335" width="100" height="25" fill="#008080" rx="6" />
  <circle cx="495" cy="360" r="12" fill="#333"/>
  <circle cx="545" cy="360" r="12" fill="#333"/>
</svg>
