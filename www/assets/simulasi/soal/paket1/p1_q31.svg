<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Panah untuk petunjuk arah -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C" />
    </marker>
  </defs>

  <!-- Background Krem -->
  <rect width="800" height="450" fill="#FDFBF7" />

  <!-- Jalan Raya (Crossroads) -->
  <rect x="350" y="0" width="100" height="450" fill="#E5E5E5" />
  <rect x="0" y="175" width="800" height="100" fill="#E5E5E5" />

  <!-- Garis Putus-putus Jalan -->
  <line x1="400" y1="0" x2="400" y2="450" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="15,15" />
  <line x1="0" y1="225" x2="800" y2="225" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="15,15" />

  <!-- Posisi Orang / Titik Mulai (Bawah) -->
  <circle cx="400" cy="420" r="16" fill="#333333" />
  <text x="400" y="445" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">START</text>

  <!-- Rute Panah (Maju lalu belok kiri) -->
  <path d="M 400 395 L 400 225 L 340 225" fill="none" stroke="#E74C3C" stroke-width="6" marker-end="url(#arrowhead)" stroke-dasharray="8,8"/>

  <!-- Gedung Bank (Kiri Jalan setelah belok / South-West) -->
  <rect x="200" y="300" width="130" height="90" fill="#4A90E2" rx="8" />
  <text x="265" y="355" font-family="sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">銀行</text>

  <!-- Opsi 3: Kafe Midori (Sebelah Bank) - Jawaban Benar -->
  <rect x="50" y="300" width="130" height="90" fill="#008080" rx="8" />
  <circle cx="115" cy="345" r="25" fill="#FFFFFF" />
  <text x="115" y="355" font-family="sans-serif" font-size="26" fill="#008080" text-anchor="middle" font-weight="bold">3</text>

  <!-- Opsi 1: Seberang Bank (North-West) -->
  <rect x="200" y="60" width="130" height="90" fill="#E5B299" rx="8" />
  <circle cx="265" cy="105" r="25" fill="#FFFFFF" />
  <text x="265" y="115" font-family="sans-serif" font-size="26" fill="#E5B299" text-anchor="middle" font-weight="bold">1</text>

  <!-- Opsi 2: Kanan Jalan (North-East) -->
  <rect x="470" y="60" width="130" height="90" fill="#E5B299" rx="8" />
  <circle cx="535" cy="105" r="25" fill="#FFFFFF" />
  <text x="535" y="115" font-family="sans-serif" font-size="26" fill="#E5B299" text-anchor="middle" font-weight="bold">2</text>

  <!-- Opsi 4: Kanan Jalan Bawah (South-East) -->
  <rect x="470" y="300" width="130" height="90" fill="#E5B299" rx="8" />
  <circle cx="535" cy="345" r="25" fill="#FFFFFF" />
  <text x="535" y="355" font-family="sans-serif" font-size="26" fill="#E5B299" text-anchor="middle" font-weight="bold">4</text>
</svg>
