    <!-- Syal hijau -->
    <path d="M195 505 C250 545 350 545 405 505 L418 552 C350 594 250 594 182 552 Z" fill="#4CAF50"/>
    <path d="M195 505 C250 545 350 545 405 505 L408 522 C350 562 250 562 192 522 Z" fill="#66C46A"/>
    <!-- Ujung syal -->
    <path d="M232 572 L262 578 L256 640 L222 630 Z" fill="#43A047"/>
    <line x1="230" y1="600" x2="258" y2="606" stroke="#66C46A" stroke-width="5"/>

    <!-- Telinga kiri -->
    <path d="M150 300 L160 150 C160 132 178 124 194 136 L300 208 Z" fill="#E58F3E"/>
    <path d="M176 275 L182 176 L262 226 Z" fill="#F7C9C0"/>
    <!-- Telinga kanan -->
    <path d="M450 300 L440 150 C440 132 422 124 406 136 L300 208 Z" fill="#E58F3E"/>
    <path d="M424 275 L418 176 L338 226 Z" fill="#F7C9C0"/>

    <!-- Kepala -->
    <ellipse cx="300" cy="350" rx="185" ry="160" fill="url(#fur)"/>

    <!-- Pipi & moncong krem -->
    <path d="M120 388 C120 322 185 308 236 344 C272 370 284 412 300 424 C316 412 328 370 364 344 C415 308 480 322 480 388 C480 462 395 508 300 508 C205 508 120 462 120 388 Z" fill="#FFF3DF"/>

    <!-- Tanda dahi -->
    <path d="M300 200 L300 232" stroke="#FFF3DF" stroke-width="10" stroke-linecap="round"/>

    <!-- Alis krem -->
    <ellipse cx="222" cy="290" rx="25" ry="16" fill="#FFF3DF"/>
    <ellipse cx="378" cy="290" rx="25" ry="16" fill="#FFF3DF"/>

    <!-- Mata (mata bahagia) -->
    <ellipse cx="222" cy="342" rx="23" ry="28" fill="#2B1B12"/>
    <ellipse cx="378" cy="342" rx="23" ry="28" fill="#2B1B12"/>
    <circle cx="230" cy="331" r="9" fill="#FFFFFF"/>
    <circle cx="386" cy="331" r="9" fill="#FFFFFF"/>
    <circle cx="214" cy="352" r="4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="370" cy="352" r="4" fill="#FFFFFF" opacity="0.85"/>

    <!-- Pipi merona -->
    <ellipse cx="164" cy="398" rx="28" ry="16" fill="#F4A6A0" opacity="0.65"/>
    <ellipse cx="436" cy="398" rx="28" ry="16" fill="#F4A6A0" opacity="0.65"/>

    <!-- Hidung -->
    <path d="M270 404 C270 388 284 380 300 380 C316 380 330 388 330 404 C330 422 316 432 300 437 C284 432 270 422 270 404 Z" fill="#2B1B12"/>
    <ellipse cx="290" cy="397" rx="10" ry="5" fill="#FFFFFF" opacity="0.5"/>

    <!-- Mulut terbuka senyum -->
    <path d="M300 437 L300 452" stroke="#2B1B12" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M254 452 C262 500 338 500 346 452 C330 462 270 462 254 452 Z" fill="#7A2E2E" stroke="#2B1B12" stroke-width="6" stroke-linejoin="round"/>
    <path d="M272 480 C282 496 318 496 328 480 C318 472 282 472 272 480 Z" fill="#F08A8A"/>
    <path d="M254 452 C242 448 234 452 228 460" stroke="#2B1B12" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M346 452 C358 448 366 452 372 460" stroke="#2B1B12" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Pudar di sisi kiri agar menyatu dengan kartu -->
    <rect x="0" y="0" width="70" height="680" fill="url(#fadeLeft)"/>
  </g>
</svg>
