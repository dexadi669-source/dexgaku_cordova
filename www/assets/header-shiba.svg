<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 680" width="580" height="680" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ilustrasi Shiba Inu Header - DeX Gaku</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9F7EB"/>
      <stop offset="100%" stop-color="#C9EBCE"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4AB5E"/>
      <stop offset="100%" stop-color="#E58F3E"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAF7EC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EAF7EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="580" height="680" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Latar -->
    <rect width="580" height="680" fill="url(#bg)"/>

    <!-- Matahari Jepang -->
    <circle cx="330" cy="250" r="215" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="330" cy="250" r="150" fill="#FFFFFF" opacity="0.6"/>

    <!-- Bukit hijau bawah -->
    <path d="M0 600 C120 560 260 570 360 590 C450 606 520 590 580 570 L580 680 L0 680 Z" fill="#8FD196"/>
    <path d="M0 640 C140 610 300 625 400 640 C480 650 540 640 580 630 L580 680 L0 680 Z" fill="#6CBF76"/>

    <!-- Sakura melayang -->
    <g fill="#F8B6C8">
      <path d="M470 90 q10-14 22 0 q-6 14 -22 0z" transform="rotate(20 480 90)"/>
      <path d="M120 170 q10-14 22 0 q-6 14 -22 0z" transform="rotate(-25 130 170)"/>
      <path d="M520 330 q9-12 20 0 q-5 12 -20 0z" transform="rotate(40 530 330)"/>
      <path d="M90 420 q9-12 20 0 q-5 12 -20 0z" transform="rotate(-10 100 420)"/>
      <path d="M400 40 q8-11 18 0 q-5 11 -18 0z" transform="rotate(60 409 40)"/>
      <path d="M215 60 q8-11 18 0 q-5 11 -18 0z" transform="rotate(-40 224 60)"/>
    </g>
    <g fill="#F48FB1" opacity="0.9">
      <circle cx="486" cy="96" r="3"/>
      <circle cx="132" cy="176" r="3"/>
      <circle cx="530" cy="336" r="3"/>
    </g>

    <g transform="translate(-30 22) scale(0.93)">
    <!-- Badan -->
    <path d="M120 700 C120 560 200 500 300 500 C400 500 480 560 480 700 Z" fill="url(#fur)"/>
    <path d="M225 700 C230 600 262 540 300 530 C338 540 370 600 375 700 Z" fill="#FFF3DF"/>

    <!-- Lengan kiri (bawah) -->
    <path d="M150 640 C140 590 170 545 210 545 C236 545 240 585 226 610 C216 630 200 650 190 690 Z" fill="#E58F3E"/>
    <ellipse cx="205" cy="640" rx="22" ry="16" fill="#FFF3DF"/>

    <!-- Lengan kanan melambai (terangkat) -->
    <g transform="translate(38 -6) rotate(-6 430 470)">
      <path d="M400 560 C440 530 470 480 470 430 C470 400 500 400 504 428 C512 490 480 560 440 610 Z" fill="#E58F3E"/>
      <!-- Telapak -->
      <ellipse cx="486" cy="402" rx="36" ry="40" fill="#FFF3DF"/>
      <!-- Jari -->
      <ellipse cx="458" cy="372" rx="10" ry="14" fill="#FFF3DF"/>
      <ellipse cx="480" cy="362" rx="10" ry="15" fill="#FFF3DF"/>
      <ellipse cx="503" cy="364" rx="10" ry="15" fill="#FFF3DF"/>
      <ellipse cx="522" cy="378" rx="9" ry="13" fill="#FFF3DF"/>
      <!-- Bantalan -->
      <ellipse cx="488" cy="410" rx="15" ry="12" fill="#F4A6A0"/>
      <circle cx="470" cy="392" r="4.5" fill="#F4A6A0"/>
      <circle cx="487" cy="384" r="4.5" fill="#F4A6A0"/>
      <circle cx="504" cy="386" r="4.5" fill="#F4A6A0"/>
    </g>
    <!-- Garis gerak lambaian -->
    <g transform="translate(6 0)" stroke="#4CAF50" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M552 330 C566 350 566 380 552 400"/>
      <path d="M572 312 C592 344 592 388 572 420" opacity="0.55"/>
